name: Simple Test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  basic-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run basic tests (no blockchain needed)
      run: npm run test:basic
      
    - name: Test address validation
      run: npm run test:addresses